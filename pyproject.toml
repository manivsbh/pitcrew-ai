[project]
name = "pitcrew-ai"
version = "0.2.0"
requires-python = ">=3.12"
description = "PITCREW.AI: Giving heavy machinery a brain — Autonomous machine diagnostics, parametric 3D twins, and acoustic investigation."

[tool.pytest.ini_options]
# Lets `pytest tests/` resolve `backend.app...` without `python -m`.
pythonpath = ["."]
testpaths = ["tests"]
